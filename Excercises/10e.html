<!DOCTYPE html>
<html lang="en">
<head>
  <title>Multiple Button</title>
  <style>
   .js-button1{
        color: rgb(240, 231, 231);
        background-color: rgb(0, 0, 0);
        border: none;
        border-radius: 0;
        padding: 6px 12px;
        cursor: pointer;
    }
   .js-button2{
        color: rgb(240, 231, 231);
        background-color: rgb(0, 0, 0);
        border: none;
        border-radius: 0;
        padding: 6px 12px;
        cursor: pointer;
    }
   .js-button3{
        color: rgb(240, 231, 231);
        background-color: rgb(0, 0, 0);
        border: none;
        border-radius: 0;
        padding: 6px 12px;
        cursor: pointer;
    }
    .toggle {
        color: rgb(0, 0, 0);
        background-color: rgb(242, 247, 247);
        border: none;
        border-radius: 0;
        padding: 6px 12px;
        cursor: pointer;
    }
    .buttons {
      position: relative;
      left: 300px;
      top: 100px;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      font-size: 48px;
      border-radius: 10px;
      margin: 5px;
    }
  </style>
</head>
<body>
  <button class="js-button1 buttons" onclick="this.classList.toggle('toggle')">Button 1</button>

  <button class="js-button2 buttons" onclick="this.classList.toggle('toggle')">Button 2</button>

  <button class="js-button3 buttons" onclick="this.classList.toggle('toggle')">Button 3</button>

</body>
</html>
